#################################################################################
### Responsible for configuring the build process for the target architecture ###
#################################################################################

[build]
target = "thumbv7m-none-eabi"

[target.thumbv7m-none-eabi]
rustflags = [
    "-C", "link-arg=-Tmcu/stm32/stm32l152ret6/memory.x", # MCU-specific memory map
    "-C", "link-arg=-Tarch/cortex-m/cortex-m-common.ld", # common linker script (must be called second)
]

[scripting]
gdb_instance = "gdb"
openocd_interface = "interface/stlink.cfg" # default for ST-Link (use /scripts/list_openocd.py to list available interfaces)
openocd_scripts_dir = "/usr/share/openocd/scripts"
openocd_target = "target/stm32l1.cfg" # chip series (use /scripts/list_openocd.py to list available targets)